name: Release

# Runs on a version tag. It gates, builds, attests, publishes, and then verifies that the
# attestation it just claimed to produce actually exists.
#
# What is wired here and what is true are different things, so both are stated. The pipeline
# below is complete: trusted publishing over OIDC, PEP 740 attestations uploaded to the index,
# SLSA provenance recorded with GitHub, and a verification job that fails when the provenance
# is absent. None of it has ever run, because it cannot until a release identity exists on the
# index side -- a pending publisher naming this repository and this workflow file. Until that
# is configured and one real tag has gone through, signing and provenance remain
# PENDING_EXTERNAL_VALIDATION, and the release notes must say so. A workflow that exists is
# not evidence; a run is.
#
# No API token is used, and none should ever be added. Trusted publishing mints a short-lived
# credential from the OIDC identity of this workflow, scoped to this repository. A long-lived
# token in a secret is the thing this design exists to avoid.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Release gate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: The tag must name the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        # A PyPI upload is consumed the moment it lands: that version number can never be
        # replaced, only yanked. Tagging v0.1.1 against a tree that still declares 0.1.0
        # would publish 0.1.0 under a tag saying otherwise, and the only remedy is burning
        # another version. Refusing here costs one comparison.
        run: |
          declared=$(uv run python -c "import tomllib, pathlib
          print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tagged="${GITHUB_REF_NAME#v}"
          echo "declared=${declared}  tagged=${tagged}"
          if [ "${declared}" != "${tagged}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the declared version ${declared}"
            exit 1
          fi

      - name: Restore the pinned model bundle
        id: bundle
        # release_gate.py runs G1 as a bare pytest, so it inherits only the `not endurance`
        # marker from addopts and the model-dependent tests execute. That is correct for a
        # release gate -- it should be the strongest check in the repository, not a subset --
        # but it means this job needs the bundle that ci.yml's gates job deliberately skips.
        # Without it the gate fails on four missing-artifact errors, which is what the first
        # run of this workflow did, at tag v0.1.0.
        #
        # restore@v6, not cache@v6: this job never writes the cache. A release runs in the
        # most privileged context in the repository and should consume caches, not populate
        # them; ci.yml's push runs on main keep the entry warm.
        uses: actions/cache/restore@v6
        with:
          path: models/artifacts
          key: model-bundle-${{ hashFiles('models/artifacts/manifest.json') }}

      - name: The restored cache must not have replaced the committed manifest
        # models/artifacts/manifest.json is committed AND lives inside the cached directory,
        # so a restore extracts over it. That matters because verify_models.py checks the
        # model bytes against that manifest: if the manifest itself came out of the cache,
        # both sides of the comparison are cache-controlled and the check proves nothing.
        # The cache key is derived from the committed manifest via hashFiles, which runs
        # before the restore, so an honest entry cannot differ here -- a difference means the
        # bytes under this key are not the bytes that key describes.
        run: |
          if ! git diff --exit-code -- models/artifacts/manifest.json; then
            echo "::error::the restored cache replaced the committed model manifest"
            exit 1
          fi

      - name: Acquire the bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        # Same fetch, retries and fail-closed reasoning as ci.yml's model-dependent job. A
        # tag ref will usually miss a cache written on main, so expect the download on most
        # releases; 403 MB is a reasonable price for a release gate that actually ran.
        run: |
          for attempt in 1 2 3; do
            if uv run python scripts/acquire_models.py; then
              exit 0
            fi
            echo "::warning::model acquisition attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "::error::model acquisition failed three times; upstream is unreachable or the pinned bytes have changed"
          exit 1

      - name: Verify the bundle against the committed manifest
        # Runs on a cache hit too: restored bytes are bytes from some earlier job, and the
        # manifest is the only thing that decides whether they are the right ones.
        run: uv run python scripts/verify_models.py

      - name: Run every blocking check
        # Not --strict: the seed corpus does not exist and the baseline is unsigned, so
        # --strict fails by design on this build. The full report is published either way,
        # and the SKIP entries are the honest record of what could not be checked.
        #
        # G7/G25 still SKIPs here because no benchmark artifact is produced on a runner, and
        # a latency figure measured on shared CI hardware would be worse than none. G8 now
        # runs its measured branch, because the bundle above exists.
        run: uv run python scripts/release_gate.py --text

      - name: Machine-readable gate report
        if: always()
        run: uv run python scripts/release_gate.py > release-gate.json || true

      - name: Upload the gate report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-gate
          path: release-gate.json

  build:
    name: Build and record evidence
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Both are for the provenance attestation below, and for nothing else.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Build
        run: uv build

      - name: Confirm the build is reproducible
        run: uv run python scripts/check_reproducible_build.py

      - name: Attest the build provenance
        # SLSA provenance, recorded against GitHub's attestation store: which workflow, at
        # which commit, on which runner, produced exactly these bytes. The verify job below
        # reads it back rather than trusting that this step ran.
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Generate the SBOM
        run: uv run python scripts/build_sbom.py --output dist/sbom.cdx.json

      - name: Cross-check the SBOM with the uv exporter
        # Two tools that agree are evidence; one tool is an assertion. The exporter is
        # preview, so a failure here is recorded rather than blocking.
        run: uv export --format cyclonedx1.5 > dist/sbom.uv.json || true

      - name: Record artifact hashes
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the distribution
        # Distributions only. The publish job uploads this directory wholesale, so anything
        # that is not a distribution has to live in a different artifact or it becomes an
        # attempted upload of SHA256SUMS to the index.
        uses: actions/upload-artifact@v7
        with:
          name: distribution
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload the evidence about it
        uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: |
            dist/SHA256SUMS
            dist/sbom.cdx.json
            dist/sbom.uv.json

  publish:
    name: Publish to PyPI
    needs: build
    # Only a tag *push* publishes, and the event check is load-bearing rather than belt and
    # braces. "Run workflow" accepts a tag as its ref, so on a dispatch against v0.1.0
    # github.ref is refs/tags/v0.1.0 and a ref-only condition would publish -- consuming a
    # version number that can never be reused, from a run whose whole purpose was to be a
    # rehearsal. The environment's v* tag policy does not catch this either, because a
    # dispatch from a tag satisfies it. Only the approval click would have stood in the way,
    # and a control that depends on a human noticing is not a control.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/prism-preflight
    permissions:
      # The only credential in this workflow. PyPI mints a short-lived token from this OIDC
      # identity, scoped to this repository and this workflow file.
      id-token: write
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v7
        with:
          name: distribution
          path: dist

      - name: Publish with trusted publishing and PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  verify:
    name: Verify the release attestation
    needs: publish
    # Same condition as publish, deliberately. It guards nothing on its own -- `needs`
    # already ties it to publish -- but a verification job whose trigger is broader than the
    # thing it verifies is how a job ends up reporting on a run that never happened.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    steps:
      - name: Download the distribution
        uses: actions/download-artifact@v7
        with:
          name: distribution
          path: dist

      - name: Every published artifact must carry verifiable provenance
        # This job exists because the build job claiming to attest is not evidence that it
        # did. The attestation is read back from GitHub and checked against this repository.
        #
        # The empty-list guard is not defensive noise: a for loop over no files succeeds,
        # so without it this job would report a green tick in exactly the case where nothing
        # was published at all.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          artifacts=(dist/*.whl dist/*.tar.gz)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::no distributions were found to verify"
            exit 1
          fi
          for artifact in "${artifacts[@]}"; do
            echo "verifying ${artifact}"
            gh attestation verify "${artifact}" --repo "${GITHUB_REPOSITORY}"
          done
