name: Security

# Advisory state changes without the repository changing, so this runs on a schedule as
# well as on demand. A scanner that cannot reach its feed must fail, never report clean:
# "no findings" and "could not check" are different results and are treated as such.

on:
  schedule:
    # Weekly, Monday 03:00 UTC.
    - cron: "0 3 * * 1"
  workflow_dispatch:
  push:
    # Deliberately not path-filtered, unlike the pull_request trigger below. A merge commit
    # is a tree nobody scanned: the pull request run scans the branch head, and the filter
    # means most merges produce no run at all, so main could carry a commit with no security
    # evidence of its own. That is not hypothetical -- neither #18 nor #19 touched the
    # filtered paths, so at 11f3162 the newest run was against a pull request head that is
    # not an ancestor of main. Every commit on main now gets its own run. ci.yml and
    # codeql.yml already trigger this way; this file was the outlier.
    branches: [main]
  pull_request:
    # Also not path-filtered, and the filter that used to be here is the reason why. These
    # jobs are required status checks on main, and a required check that does not run is not
    # a skipped check -- GitHub waits for a status that will never be reported, so the pull
    # request cannot merge at all. A filter here would therefore block every documentation
    # or test-only change permanently.
    #
    # The filter it replaces listed uv.lock, pyproject.toml, this file and scripts/**. That
    # matched the advisories job's inputs well enough, but it was already wrong for the
    # other two: a docs-only change can break a link, and check_links.py is what would have
    # caught it. Running unconditionally costs about a minute and removes a whole class of
    # "the gate did not run, so the tick means nothing".

permissions:
  contents: read

jobs:
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: pip-audit
        # --strict fails on an incomplete scan rather than reporting a clean result for
        # packages it could not resolve. The target is the exported lock rather than the
        # environment, matching scripts/release_gate.py: the environment also holds prism
        # itself, which is unpublished, so --strict would fail on every run for a package
        # that has no advisory feed to check against.
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev -o requirements-audit.txt
          uv run pip-audit --strict -r requirements-audit.txt

      - name: OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.0
        with:
          scan-args: |-
            --lockfile=uv.lock

      - name: Build the SBOM
        run: uv run python scripts/build_sbom.py --output dist/sbom.cdx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          # Not "sbom-scheduled": this workflow has four triggers and only one of them is
          # the schedule, so that name described where three quarters of these artifacts
          # came from incorrectly.
          name: sbom
          path: dist/sbom.cdx.json

  offline:
    name: No outbound connection during analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Offline check, preflight and synthesis
        # The model bundle is not committed, so the measurement leg cannot run here. It is
        # covered locally against the real bundle; this proves the deterministic path.
        run: uv run python scripts/verify_offline.py --skip-measure

  documentation:
    name: Stale links and unpublished references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Documentation relations
        run: uv run python scripts/check_links.py
