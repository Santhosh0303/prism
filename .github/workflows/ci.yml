name: CI

# Every gate that can run without the model bundle. The bundle is 403 MB of third-party
# artifacts and is not committed, so measurement-dependent jobs are marked and skipped
# rather than silently passing on an environment that could not have run them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic fixtures must be deterministic in CI too, not only locally.
  PYTHONHASHSEED: "0"

jobs:
  gates:
    name: Tests and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync the locked environment
        # --frozen: resolve nothing. A CI run that quietly updates the lock is not testing
        # what a user will install.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Import boundaries
        run: uv run lint-imports

      - name: Static security
        run: uv run bandit -r src -q

      - name: Dead code
        run: uv run vulture src tests --min-confidence 90

      - name: Unused dependencies
        run: uv run deptry .

      - name: Test suite
        run: uv run pytest -q

      - name: Documentation relations
        run: uv run python scripts/check_links.py

      - name: Architecture fitness functions
        run: uv run python scripts/check_architecture.py

      - name: Seed provenance
        # Reports SKIP and exits non-zero while no corpus exists. That is the honest state,
        # so it is surfaced without failing the run.
        run: uv run python scripts/check_seed_lock.py || true

      - name: Regression baseline integrity
        run: uv run python scripts/check_regression_baseline.py

      - name: Build the SBOM
        run: uv run python scripts/build_sbom.py --output dist/sbom.cdx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: dist/sbom.cdx.json

  determinism:
    name: Determinism across environments
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Canonical digest matrix
        # Path handling, locale, and stdio differ per platform; the canonical digest must
        # not.
        run: uv run pytest tests/regression tests/contract tests/compatibility -q

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Two clean builds, compared
        run: uv run python scripts/check_reproducible_build.py
