name: CI

# Every gate that can run without the model bundle. The bundle is 403 MB of third-party
# artifacts and is not committed, so measurement-dependent jobs are marked and skipped
# rather than silently passing on an environment that could not have run them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Deterministic fixtures must be deterministic in CI too, not only locally.
  PYTHONHASHSEED: "0"

jobs:
  gates:
    name: Tests and static gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync the locked environment
        # --frozen: resolve nothing. A CI run that quietly updates the lock is not testing
        # what a user will install.
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy src tests

      - name: Import boundaries
        run: uv run lint-imports

      - name: Static security
        run: uv run bandit -r src -q

      - name: Dead code
        run: uv run vulture src tests --min-confidence 90

      - name: Unused dependencies
        run: uv run deptry .

      - name: Test suite and coverage gate
        # --cov makes fail_under (pyproject.toml, [tool.coverage.report]) an actual gate.
        # Without it coverage is measured by whoever remembers to ask, which is nobody.
        run: uv run pytest -q -m "not models and not endurance" --cov=src/prism --cov-report=term

      - name: Documentation relations
        run: uv run python scripts/check_links.py

      - name: Architecture fitness functions
        run: uv run python scripts/check_architecture.py

      - name: Seed provenance
        # Reports SKIP and exits non-zero while no corpus exists. That is the honest state,
        # so it is surfaced without failing the run.
        run: uv run python scripts/check_seed_lock.py || true

      - name: Regression baseline integrity
        run: uv run python scripts/check_regression_baseline.py

      - name: Build the SBOM
        run: uv run python scripts/build_sbom.py --output dist/sbom.cdx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: dist/sbom.cdx.json

  determinism:
    name: Determinism across environments
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Canonical digest matrix
        # Path handling, locale, and stdio differ per platform; the canonical digest must
        # not.
        run: uv run pytest tests/regression tests/contract tests/compatibility -q

  model-dependent:
    name: Measurement on the real bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync the locked environment
        run: uv sync --frozen

      - name: Restore the pinned model bundle
        id: bundle
        uses: actions/cache@v6
        with:
          path: models/artifacts
          # Keyed on the committed manifest's bytes. Adopting a new pinned revision
          # changes the manifest, misses the cache, and re-fetches — so a stale cache
          # cannot quietly serve yesterday's weights to today's assertions.
          key: model-bundle-${{ hashFiles('models/artifacts/manifest.json') }}

      - name: Acquire the bundle
        if: steps.bundle.outputs.cache-hit != 'true'
        # 403 MB from the pinned immutable revisions. Refuses a mutable ref, an
        # undocumented repository/revision pair, and any file whose bytes do not hash to
        # the manifest.
        #
        # Retried because this job is blocking and a transient upstream 5xx or reset would
        # otherwise block the branch on something that is not about the change under test.
        # Retries are the right answer only because the script is fail-closed and
        # idempotent: a partial or wrong-hashing file is discarded rather than left behind,
        # so attempt N+1 starts from a clean state and cannot inherit attempt N's damage.
        # This absorbs blips, not an outage — a sustained upstream failure still blocks,
        # which is correct, because the alternative is a green tick over untested code.
        run: |
          for attempt in 1 2 3; do
            if uv run python scripts/acquire_models.py; then
              exit 0
            fi
            echo "::warning::model acquisition attempt ${attempt} failed"
            sleep $((attempt * 20))
          done
          echo "::error::model acquisition failed three times; upstream is unreachable or the pinned bytes have changed"
          exit 1

      - name: Verify the bundle against the committed manifest
        # Runs on a cache hit too. A restored cache is bytes from some earlier job; the
        # manifest is the only thing that decides whether they are the right bytes.
        run: uv run python scripts/verify_models.py

      - name: Measurement tests
        # The parity assertion for measurement lives here. Without this job it is
        # deselected everywhere except a maintainer's laptop, which is the same as not
        # having it.
        run: uv run pytest -m "models and not endurance" -q

  reproducible-build:
    name: Reproducible build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Two clean builds, compared
        run: uv run python scripts/check_reproducible_build.py
