version: 2

# Automated tools may open pull requests. They may not merge. Any behaviour-changing update
# needs a golden-diff review before it lands, and an automatic merge would route around
# exactly the review that matters.

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One pull request for the toolchain keeps review effort proportionate; runtime
      # dependencies stay individual, because each one is inside the six-package budget and
      # deserves its own decision.
      dev-tools:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
