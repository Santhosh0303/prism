[project]
# The distribution name is not the import name. "prism" on PyPI is an unrelated
# Bayesian/MCMC project, so a documented `uv tool install prism` installed someone else's
# code. The import package stays `prism` and both console scripts keep their names.
name = "prism-preflight"
version = "0.1.0"
description = "Local-first, model-agnostic reasoning preflight and contradiction-measurement component for AI harnesses."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sai Santhosh Bellam", email = "bellam03santhosh@gmail.com" }
]
requires-python = ">=3.12,<3.13"
keywords = ["mcp", "reasoning", "contradiction", "nli", "perspectives", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2,<3",
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "tokenizers>=0.21,<1",
]

# Runtime direct dependency budget is six. Additions require a
# documented missing capability, security review, size/startup impact, licence review,
# alternative analysis, and a removal plan. tests/unit/test_dependency_budget.py enforces this.

[project.scripts]
prism = "prism.cli:main"
prism-mcp = "prism.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# uv_build derives the module from the distribution name. The distribution is
# `prism-preflight` and the import package is, and stays, `prism`.
module-name = "prism"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "deptry>=0.25.1",
    "hypothesis>=6.165.2",
    "import-linter>=2.13",
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "psutil>=7.2.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
    "vulture>=2.16",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Documentation prose is not source code. Fenced examples in Markdown are written to be
# read, sometimes deliberately elided, and must not be rewritten by a formatter that gains
# Markdown support in a future release. Linting stays confined to the code trees below.
extend-exclude = ["*.md"]
include = [
    "src/**/*.py",
    "tests/**/*.py",
    "scripts/**/*.py",
    "benchmarks/**/*.py",
    "pyproject.toml",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "PTH", "SIM", "TID", "RUF", "S"]
ignore = [
    "S101",    # assert is the test idiom; module-load invariants use raise instead
    "TID252",  # package-internal relative imports are intentional and keep the
               # core relocatable; cross-package boundaries are enforced by
               # import-linter, which is the control that actually matters
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
# The determinism matrix must spawn fresh interpreters: a digest that is stable within
# one process proves nothing about hash seeding or locale. Fixed argv, no shell, no
# caller-supplied input.
"tests/regression/test_canonical_digest_matrix.py" = [
    "S603",
    # RUF001/RUF003 flag the dotless i as a homoglyph of "i". Here it is the fixture:
    # the Turkish casefolding trap cannot be exercised with unambiguous characters.
    "RUF001",
    "RUF003",
]



[tool.mypy]
python_version = "3.12"
# The gate scripts are a flat package on sys.path, not an installed one. Without this, the
# mutation suite that proves those gates work cannot be type-checked at all.
mypy_path = "scripts"
strict = true
warn_unused_configs = true
warn_unreachable = true
disallow_any_unimported = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "tokenizers.*"]
ignore_missing_imports = true

# onnxruntime and tokenizers ship no type information, so every value crossing that
# boundary is Any. Confined to the one module that touches them; the rest of the
# codebase keeps disallow_any_unimported.
[[tool.mypy.overrides]]
module = ["prism.measure.models"]
disallow_any_unimported = false
warn_return_any = false

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# The endurance marker is deselected by default. A soak belongs on a dedicated machine, and
# a slow blocking test is one people learn to skip. Run it explicitly:
#   uv run pytest tests/endurance -m endurance
addopts = "-q --strict-markers --strict-config -m 'not endurance'"
timeout = 120
markers = [
    "slow: takes more than a few seconds",
    "models: requires the verified local ONNX model bundle",
    "stress: burst, flood, cold-race and recovery probes",
    "endurance: long-duration soak; excluded from the default run",
    "benchmark: latency/resource measurement, not a correctness assertion",
]

[tool.coverage.run]
branch = true
source = ["src/prism"]

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
# Measured 2026-08-12 over the CI selection (-m "not models and not endurance"):
# 84.90% on the ubuntu runner that enforces this, 84.97% locally on Windows. Platform
# drift is 0.07 points, so the floor sits just under the measured value rather than well
# under it. Raise it when a measured floor justifies the raise; do not lower it to make a
# red run green.
fail_under = 84

[tool.vulture]
min_confidence = 90
paths = ["src", "tests"]

[tool.deptry]
known_first_party = ["prism"]
# benchmarks/ and scripts/ are developer tooling, not part of the distributed package. Their
# imports are dev-group packages and flat sibling modules, neither of which belongs in the
# runtime dependency budget this check exists to protect.
extend_exclude = ["benchmarks", "scripts"]

[tool.importlinter]
root_package = "prism"
# Required so that forbidden third-party modules (onnxruntime, torch, requests, ...)
# are analysed rather than silently ignored.
include_external_packages = true

# The core must never depend on host adapters: dependency runs one way only, so an
# integration cannot change measurement behaviour.
[[tool.importlinter.contracts]]
name = "Core does not import integrations"
type = "forbidden"
source_modules = ["prism"]
forbidden_modules = ["integrations"]

# Preflight imports no model runtime, so it keeps working when the bundle is absent.
[[tool.importlinter.contracts]]
name = "Preflight imports no inference runtime"
type = "forbidden"
source_modules = ["prism.preflight"]
forbidden_modules = ["onnxruntime", "tokenizers", "numpy"]

# No execution, network or shell capability in the core.
[[tool.importlinter.contracts]]
name = "Core has no execution or network capability"
type = "forbidden"
source_modules = ["prism"]
forbidden_modules = ["subprocess", "socket", "http", "urllib", "requests", "httpx", "ftplib", "telnetlib", "smtplib", "webbrowser", "ctypes"]

# No provider SDK may enter the runtime graph: PRISM measures model output, it does not
# call models over an API.
[[tool.importlinter.contracts]]
name = "No model-provider SDK in core"
type = "forbidden"
source_modules = ["prism"]
forbidden_modules = ["openai", "anthropic", "google", "cohere", "mistralai", "torch", "tensorflow", "jax", "transformers", "langchain", "langgraph", "crewai", "autogen"]

# Layering: adapters sit above the service facade, which sits above the engines.
[[tool.importlinter.contracts]]
name = "Adapter / service / engine layering"
type = "layers"
# Siblings on one line must be independent of each other, so modules that legitimately
# depend on one another get their own rung.
layers = [
    "prism.cli | prism.mcp_server",
    "prism.service",
    "prism.synthesis",
    "prism.measure",
    "prism.preflight",
    "prism.contracts",
    "prism.limits",
    "prism.errors",
    "prism.constants | prism.version",
]
